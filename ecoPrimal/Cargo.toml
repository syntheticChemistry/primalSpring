# SPDX-License-Identifier: AGPL-3.0-or-later

[package]
name = "primalspring"
version = "0.9.46"
edition.workspace = true
rust-version.workspace = true
authors = ["ecoPrimals"]
license.workspace = true
description = "NUCLEUS evolution arena — composition validation, certification, and primal coordination probing"
repository = "https://github.com/syntheticChemistry/primalSpring"
keywords = ["coordination", "composition", "nucleus", "biomeos", "testing"]
categories = ["science", "command-line-utilities"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hkdf = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }
chacha20poly1305 = { workspace = true }
serde_yaml_ng = { workspace = true }


[lints]
workspace = true

[[bin]]
name = "primalspring_unibin"
path = "src/bin/primalspring/main.rs"

[[bin]]
name = "nucleus_launcher"
path = "src/bin/nucleus_launcher/main.rs"

[features]
stub-primals = []
primordial-compat = []

[[test]]
name = "server_ecosystem"
required-features = ["primordial-compat"]

[[test]]
name = "server_ecosystem_overlay"
required-features = ["primordial-compat"]

[[test]]
name = "server_ecosystem_songbird"
required-features = ["primordial-compat"]

[[test]]
name = "server_ecosystem_genetics"
required-features = ["primordial-compat"]

[[test]]
name = "compose_compute"
required-features = ["primordial-compat"]

[[test]]
name = "compose_node"
required-features = ["primordial-compat"]

[[test]]
name = "compose_nest"
required-features = ["primordial-compat"]

[dev-dependencies]
proptest = "1.10.0"
tempfile = "3.27.0"
