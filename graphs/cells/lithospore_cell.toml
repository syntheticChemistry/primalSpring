# Cellular deployment graph: lithoSpore
#
# NUCLEUS base + pseudoSpore lifecycle + provenance validation.
# lithoSpore manages the emit/ingest/verify lifecycle of pseudoSpores.
# Deploy: biomeos deploy --graph graphs/cells/lithospore_cell.toml

[graph]
name = "lithospore_cell"
description = "lithoSpore — NUCLEUS + pseudoSpore lifecycle + provenance"
version = "2.0.0"
coordination = "sequential"

[graph.metadata]
cell_type = "garden"
domain = "pseudospore_lifecycle"
security_model = "btsp_enforced"
transport = "uds_only"
composition_model = "nucleated"
petaltongue_mode = "live"
assigned_gate = "ironGate"
data_gate = "westGate"

[graph.bonding_policy]
bond_type = "Ionic"
trust_model = "MethodGate"

[[graph.nodes]]
name = "biomeos_neural_api"
security_model = "btsp"
binary = "biomeos"
order = 0
required = true
spawn = false
health_method = "health.liveness"
by_capability = "orchestration"
capabilities = ["graph.deploy", "capability.discover", "topology.rescan"]

[[graph.nodes]]
name = "beardog"
security_model = "btsp"
binary = "beardog"
order = 1
required = true
spawn = false
depends_on = ["biomeos_neural_api"]
health_method = "health.liveness"
by_capability = "security"
capabilities = ["crypto.sign", "crypto.verify", "crypto.hash"]

[[graph.nodes]]
name = "songbird"
security_model = "btsp"
binary = "songbird"
order = 2
required = true
spawn = false
depends_on = ["biomeos_neural_api"]
health_method = "health.liveness"
by_capability = "discovery"
capabilities = ["ipc.resolve", "ipc.register", "discovery.peers"]

[[graph.nodes]]
name = "toadstool"
security_model = "btsp"
binary = "toadstool"
order = 3
required = true
spawn = false
depends_on = ["beardog", "songbird"]
health_method = "health.liveness"
by_capability = "compute"
capabilities = ["compute.dispatch", "compute.execute", "compute.capabilities"]

[[graph.nodes]]
name = "nestgate"
security_model = "btsp"
binary = "nestgate"
order = 6
required = true
spawn = false
depends_on = ["beardog"]
health_method = "health.liveness"
by_capability = "storage"
capabilities = ["storage.store", "storage.retrieve", "storage.list", "content.get", "content.put"]

[[graph.nodes]]
name = "rhizocrypt"
security_model = "btsp"
binary = "rhizocrypt"
order = 7
required = true
spawn = false
depends_on = ["beardog"]
health_method = "health.liveness"
by_capability = "dag"
capabilities = ["dag.session.create", "dag.event.append", "dag.event.append_batch", "dag.vertex.get", "dag.merkle.root", "dag.merkle.proof", "dag.merkle.verify"]

[[graph.nodes]]
name = "loamspine"
security_model = "btsp"
binary = "loamspine"
order = 8
required = true
spawn = false
depends_on = ["beardog", "rhizocrypt"]
health_method = "health.liveness"
by_capability = "ledger"
capabilities = ["spine.create", "entry.append", "entry.get", "certificate.mint", "certificate.get", "proof.generate_inclusion"]

[[graph.nodes]]
name = "sweetgrass"
security_model = "btsp"
binary = "sweetgrass"
order = 9
required = true
spawn = false
depends_on = ["beardog", "loamspine"]
health_method = "health.liveness"
by_capability = "attribution"
capabilities = ["braid.create", "braid.commit", "anchoring.anchor", "anchoring.verify", "provenance.graph", "provenance.export_provo"]

[[graph.nodes]]
name = "petaltongue"
security_model = "btsp"
binary = "petaltongue"
order = 11
required = false
spawn = false
depends_on = ["songbird"]
health_method = "health.liveness"
by_capability = "visualization"
capabilities = ["visualization.render", "visualization.render.scene", "interaction.subscribe"]

[graph.nodes.params]
mode = "live"

[[graph.nodes]]
name = "lithospore"
security_model = "btsp"
binary = "litho"
order = 12
required = true
depends_on = ["beardog", "songbird", "nestgate", "rhizocrypt", "loamspine", "sweetgrass"]
health_method = "health.liveness"
by_capability = "pseudospore"
capabilities = ["spore.emit", "spore.ingest", "spore.verify", "spore.bundle", "spore.list"]

[[graph.nodes]]
name = "validate_cell"
security_model = "btsp"
order = 99
depends_on = ["lithospore"]

[graph.nodes.operation]
name = "health_check"

[graph.nodes.operation.params]
targets = ["beardog", "songbird", "nestgate", "rhizocrypt", "loamspine", "sweetgrass", "lithospore"]
