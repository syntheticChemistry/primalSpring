# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Atomic Signal: waterFall sync.resolve
#
# Resolves a detected divergence on a single gate. This is the `agentic`
# policy path from `ecosystem_manifest.toml` — when repo_policy = "agentic",
# the cascade engine delegates to this graph via the Neural API instead of
# running hardcoded cellMembrane merge logic.
#
# Re-confirms divergence, attempts merge-ff/rebase, detects conflicts,
# signs the resolution commit, records in the ledger, pushes resolved state,
# and fires a RESOLUTION impulse to clear the active SYNC.
#
# Coordination domain: waterFall (ACTION / efferent)

[graph]
id = "sync_resolve"
name = "Sync Resolve"
description = "Resolve single-gate divergence. Check → classify → merge → detect → sign → commit → push → resolve."
version = "1.0.0"
coordination = "sequential"
composition_tier = "waterfall"
composition_name = "resolve"
coordination_domain = "fall"

[graph.metadata]
particle = "neutron"
security_model = "btsp_enforced"
transport = "uds_only"
secure_by_default = true
fragments = ["tower_atomic", "provenance_trio"]

[[graph.nodes]]
name = "check"
binary = "membrane"
order = 1
required = true
spawn = false
by_capability = "temporal"
capabilities = ["temporal.check"]

[[graph.nodes]]
name = "classify"
binary = "membrane"
order = 2
required = true
spawn = false
depends_on = ["check"]
by_capability = "temporal"
capabilities = ["temporal.classify"]

[[graph.nodes]]
name = "merge"
binary = "membrane"
order = 3
required = true
spawn = false
depends_on = ["classify"]
by_capability = "temporal"
capabilities = ["temporal.sync"]

[[graph.nodes]]
name = "detect"
binary = "membrane"
order = 4
required = true
spawn = false
depends_on = ["merge"]
by_capability = "temporal"
capabilities = ["conflict.detect"]

[[graph.nodes]]
name = "sign"
binary = "beardog"
order = 5
required = true
spawn = false
depends_on = ["detect"]
by_capability = "security"
capabilities = ["crypto.sign_ed25519"]

[[graph.nodes]]
name = "commit"
binary = "loamspine"
order = 6
required = true
spawn = false
depends_on = ["sign"]
by_capability = "ledger"
capabilities = ["session.commit"]

[[graph.nodes]]
name = "push"
binary = "membrane"
order = 7
required = true
spawn = false
depends_on = ["commit"]
by_capability = "temporal"
capabilities = ["temporal.sync"]

[[graph.nodes]]
name = "resolve"
binary = "membrane"
order = 8
required = true
spawn = false
depends_on = ["push"]
by_capability = "temporal"
capabilities = ["impulse.post"]
